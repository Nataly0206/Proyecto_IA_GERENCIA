services:
  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lfu"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dashboard-backend
    restart: unless-stopped
    ports:
      # Disponible para diagnóstico desde la misma máquina, no para toda
      # la red local. Nginx accede por la red interna de Docker.
      - "127.0.0.1:3002:3002"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3002
      # En backend/.env se usa localhost para desarrollo. Desde un contenedor
      # el SQL Server publicado por Docker se alcanza mediante el host.
      DB_SERVER: ${DOCKER_DB_SERVER:-host.docker.internal}
      AUTH_DB_SERVER: ${DOCKER_AUTH_DB_SERVER:-host.docker.internal}
      AI_CONTEXT_PATH: /app/docs/Documentacion_Completa_BD_STB.md
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
